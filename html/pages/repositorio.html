<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Repositório de TCC | Biblioteca Estácio São Luís</title>
  <meta name="description" content="Repositório de TCC da Biblioteca Estácio São Luís">

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../assets/css/pages/repositorio.css" />
</head>

<body>

<!-- MENU -->
<button class="menu-toggle" id="menuToggle">
  <i class="ri-menu-line"></i>
</button>

<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- HERO -->
<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <section class="hero-section">
    <div class="hero-content">

      <div class="hero-eyebrow">
        <i class="ri-archive-line"></i>
        Produção Acadêmica
      </div>

      <h2>Repositório de <span class="hero-title-accent">TCC</span></h2>

      <p class="hero-subtitle">
        Acesse, visualize e baixe Trabalhos de Conclusão de Curso
        desenvolvidos pelos alunos da instituição.
      </p>

    </div>
  </section>
</header>

<!-- CONTEÚDO -->
<main class="content-full">
  <section class="section-destaques">

    <h2>Repositório de TCC</h2>
    <p>Visualize os trabalhos acadêmicos disponíveis na biblioteca digital.</p>

    <!-- PDF VIEWER -->
    <div class="pdf-wrapper">

      <div class="pdf-canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>

      <div class="pdf-controls">

        <!-- NAVEGAÇÃO -->
        <div class="pdf-nav">
          <button id="btn-prev" class="btn-control" title="Página anterior">
            <i class="ri-arrow-left-s-line"></i>
          </button>

          <span class="pdf-info">
            <span id="pg-atual">1</span>
            <span class="pdf-separator">/</span>
            <span id="pg-total">1</span>
          </span>

          <button id="btn-next" class="btn-control" title="Próxima página">
            <i class="ri-arrow-right-s-line"></i>
          </button>
        </div>

        <!-- ZOOM -->
        <div class="pdf-zoom">
          <button id="btn-zoom-out" class="btn-control" title="Diminuir zoom">
            <i class="ri-subtract-line"></i>
          </button>

          <span id="zoom-level" class="pdf-zoom-level">100%</span>

          <button id="btn-zoom-in" class="btn-control" title="Aumentar zoom">
            <i class="ri-add-line"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- AÇÕES -->
    <div class="acoes">
      <button class="btn-visualizar" id="abrirModal">
        <i class="ri-fullscreen-line"></i>
        Tela cheia
      </button>

      <a href="../../assets/docs/documentosinformativos/repositoriotcc.pdf"
         download
         class="btn-download">
        <i class="ri-download-2-line"></i>
        Baixar PDF
      </a>
    </div>

  </section>

</main>

<!-- MODAL-->
<div class="modal" id="modalPDF">
  <div class="modal-content">

    <button class="modal-close" id="fecharModal" title="Fechar">
      <i class="ri-close-line"></i>
    </button>

    <iframe
      src="../../assets/docs/documentosinformativos/repositoriotcc.pdf"
      class="modal-iframe"
      title="Repositório de TCC">
    </iframe>

  </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- FOOTER -->
<div id="footer-container"></div>

<!-- JS -->
<script src="../../assets/js/pages/repositorio.js" defer></script>
<script src="../../assets/js/layout/global.js" defer></script>
<script src="../../assets/js/layout/layout.js" defer></script>
<script src="../../assets/js/layout/pdf-viewer.js" defer></script>




</body>
</html>
