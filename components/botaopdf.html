<div class="pdf-controls">

  <!-- NAVEGAÇÃO -->
  <div class="pdf-nav">
    <button class="btn-control" data-prev aria-label="Página anterior">
      <i class="ri-arrow-left-s-line"></i>
    </button>

    <span class="pdf-info">
      <span data-page-num>1</span>
      <span class="pdf-separator">/</span>
      <span data-page-count>1</span>
    </span>

    <button class="btn-control" data-next aria-label="Próxima página">
      <i class="ri-arrow-right-s-line"></i>
    </button>
  </div>

  <!-- ZOOM -->
  <div class="pdf-zoom">
    <button class="btn-control" data-zoom-out aria-label="Diminuir zoom">
      <i class="ri-subtract-line"></i>
    </button>

    <span class="pdf-zoom-level" data-zoom-level>100%</span>

    <button class="btn-control" data-zoom-in aria-label="Aumentar zoom">
      <i class="ri-add-line"></i>
    </button>
  </div>

</div>
